<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>IPER Virtual GD</title>
  <link rel="stylesheet" href="/gd_room.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="brand">IPER</div>
        <div class="subtitle">Virtual Group Discussion</div>
      </div>
      <div class="status-wrap">
        <span id="connectionDot" class="dot offline"></span>
        <span id="connectionText">Connecting…</span>
      </div>
    </header>

    <section class="setup card" id="setup">
      <h1>Join your GD room</h1>
      <p class="muted">This is the Phase 1 IPER-owned WebRTC room. Maximum 7 students.</p>

      <label>GD Room Code
        <input id="roomCode" maxlength="12" placeholder="e.g. 8K4P7Q" autocomplete="off">
      </label>

      <div class="profile-grid">
        <label>First Name
          <input id="firstName" placeholder="First Name">
        </label>
        <label>Last Name
          <input id="lastName" placeholder="Last Name">
        </label>
        <label>Scholar ID
          <input id="scholarId" placeholder="23BBA041">
        </label>
        <label>IPER Email
          <input id="email" type="email" placeholder="student@iper.ac.in">
        </label>
      </div>

      <button id="joinBtn" class="primary">Join Virtual GD</button>
      <p id="setupError" class="error"></p>
    </section>

    <section id="room" class="hidden">
      <div class="roombar card">
        <div>
          <strong>IPER Virtual GD</strong>
          <span id="roomLabel" class="muted"></span>
        </div>
        <div class="timer" id="timer">10:00</div>
      </div>

      <div id="videoGrid" class="video-grid"></div>

      <div class="controls card">
        <button id="micBtn" class="control">🎙️ Mic</button>
        <button id="cameraBtn" class="control">📷 Camera</button>
        <button id="leaveBtn" class="control danger">Leave</button>
      </div>

      <p id="roomError" class="error"></p>
    </section>
  </main>

  <script type="module" src="/gd_room.js"></script>
</body>
</html>
