<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPER Virtual GD Room</title>
<style>
body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1220;color:#fff}.wrap{padding:12px}.bar{display:flex;justify-content:space-between;align-items:center;background:#111827;padding:10px 14px;border-radius:10px 10px 0 0}.timer{font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#020617;padding:8px}.tile{position:relative;background:#111827;min-height:180px;border-radius:8px;overflow:hidden}.tile video{width:100%;height:100%;object-fit:cover;background:#000}.name{position:absolute;left:8px;bottom:7px;background:rgba(0,0,0,.65);padding:5px 8px;border-radius:5px;font-size:12px}.controls{display:flex;gap:8px;padding:10px;background:#111827}.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}.start{background:#16a34a;color:white}.end{background:#dc2626;color:white}.neutral{background:#e2e8f0;color:#0f172a}.status{padding:9px 12px;background:#1e293b;font-size:13px}.warn{font-size:12px;color:#cbd5e1;padding:8px 0}</style>
</head>
<body><div class="wrap"><div class="bar"><div><b>IPER Virtual Group Discussion</b><div style="font-size:12px;opacity:.8">Maximum 7 students • 1080p preferred • maximum 10 minutes</div></div><div id="timer" class="timer">10:00</div></div><div id="grid" class="grid"></div><div class="controls"><button id="start" class="btn start" disabled>Start GD & Recording</button><button id="end" class="btn end" disabled>End GD</button><button id="mute" class="btn neutral">Mute</button><button id="camera" class="btn neutral">Camera Off</button></div><div id="status" class="status">Connecting...</div><div class="warn">Actual video quality depends on camera, browser, network and server capacity. 1080p is requested, not guaranteed.</div></div>
<script>
const params=new URLSearchParams(location.search);const room=params.get('room');const token=params.get('token');
const wsBase=params.get('ws')||((location.protocol==='https:'?'wss://':'ws://')+location.host);const ws=new WebSocket(wsBase.replace(/\/$/,'')+'/ws/'+encodeURIComponent(room)+'?token='+encodeURIComponent(token));
let selfId='',isHost=false,localStream=null,peers=new Map(),startedAt=null,timerHandle=null,recording=null,recordChunks=[],audioCtx=null,mixDest=null,recordCanvas=null,canvasCtx=null,recordRAF=null;
const grid=document.getElementById('grid'),statusEl=document.getElementById('status'),timerEl=document.getElementById('timer');
function status(t){statusEl.textContent=t}
function addTile(id,name,stream,local=false){let tile=document.getElementById('tile-'+CSS.escape(id));if(!tile){tile=document.createElement('div');tile.className='tile';tile.id='tile-'+id;let v=document.createElement('video');v.id='video-'+id;v.autoplay=true;v.playsInline=true;v.muted=local;tile.appendChild(v);let n=document.createElement('div');n.className='name';n.textContent=name+(local?' • You':'');tile.appendChild(n);grid.appendChild(tile)}let v=document.getElementById('video-'+CSS.escape(id));if(v.srcObject!==stream){v.srcObject=stream;v.play().catch(()=>{})}}
function removeTile(id){let e=document.getElementById('tile-'+CSS.escape(id));if(e)e.remove()}
async function ensureLocal(){if(localStream)return localStream;localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:{width:{ideal:1920,max:1920},height:{ideal:1080,max:1080},frameRate:{ideal:30,max:30}}});return localStream}
function makePC(id,name){let pc=peers.get(id)?.pc;if(pc)return pc;pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)ws.send(JSON.stringify({type:'ice',target:id,candidate:e.candidate}))};pc.ontrack=e=>{let stream=e.streams[0];if(!peers.has(id))peers.set(id,{pc,name,stream});else peers.get(id).stream=stream;addTile(id,name,stream,false)};pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){removeTile(id)}};peers.set(id,{pc,name,stream:null});return pc}
async function offerTo(id,name){let pc=makePC(id,name);let offer=await pc.createOffer();await pc.setLocalDescription(offer);ws.send(JSON.stringify({type:'offer',target:id,offer}))}
async function handleOffer(m){let pc=makePC(m.from,m.from_name);await pc.setRemoteDescription(m.offer);let ans=await pc.createAnswer();await pc.setLocalDescription(ans);ws.send(JSON.stringify({type:'answer',target:m.from,answer:ans}))}
async function handleAnswer(m){let p=peers.get(m.from);if(p)await p.pc.setRemoteDescription(m.answer)}
async function handleIce(m){let p=peers.get(m.from);if(p)try{await p.pc.addIceCandidate(m.candidate)}catch(e){}}
function setTimer(){clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!startedAt){timerEl.textContent='10:00';return}let left=Math.max(0,600-(Date.now()/1000-startedAt));let s=Math.floor(left),m=Math.floor(s/60),sec=s%60;timerEl.textContent=`${m}:${String(sec).padStart(2,'0')}`;if(left<=0){clearInterval(timerHandle);if(isHost){stopRecording();ws.send(JSON.stringify({type:'end_gd'}))}status('10-minute limit reached. GD ended.')}} ,250)}
function setupRecorder(){recordCanvas=document.createElement('canvas');recordCanvas.width=1920;recordCanvas.height=1080;canvasCtx=recordCanvas.getContext('2d');audioCtx=new AudioContext();mixDest=audioCtx.createMediaStreamDestination();let addAudio=s=>{if(!s)return;let tracks=s.getAudioTracks();if(tracks.length){let src=audioCtx.createMediaStreamSource(new MediaStream([tracks[0]]));src.connect(mixDest)}};addAudio(localStream);peers.forEach(p=>addAudio(p.stream));function draw(){canvasCtx.fillStyle='#020617';canvasCtx.fillRect(0,0,1920,1080);let vids=[...document.querySelectorAll('.tile video')];let cols=4,rows=Math.ceil(Math.max(vids.length,1)/cols),w=1920/cols,h=1080/rows;vids.forEach((v,i)=>{let x=(i%cols)*w,y=Math.floor(i/cols)*h;try{canvasCtx.drawImage(v,x,y,w,h)}catch(e){}});recordRAF=requestAnimationFrame(draw)}draw();let stream=recordCanvas.captureStream(30);mixDest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime='video/webm;codecs=vp9,opus';if(!MediaRecorder.isTypeSupported(mime))mime='video/webm';recordChunks=[];recording=new MediaRecorder(stream,{mimeType:mime});recording.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recording.onstop=uploadRecording;recording.start(1000)}
async function uploadRecording(){cancelAnimationFrame(recordRAF);if(audioCtx)audioCtx.close();let blob=new Blob(recordChunks,{type:'video/webm'});let fd=new FormData();fd.append('token',token);fd.append('room_code',room);fd.append('recording',blob,'GD_'+room+'_'+Date.now()+'.webm');try{let r=await fetch('/recording',{method:'POST',body:fd});if(r.ok)status('Full GD recording uploaded successfully.')}catch(e){status('GD ended. Recording upload failed; keep the local recording safe if available.')} }
function startRecording(){if(!isHost)return;setupRecorder()}
function stopRecording(){if(recording&&recording.state!=='inactive')recording.stop()}
ws.onopen=async()=>{try{await ensureLocal();status('Camera and microphone ready. Joining room...');ws.send(JSON.stringify({type:'join'}))}catch(e){status('Camera/microphone permission error: '+e.message)}};
ws.onmessage=async e=>{let m=JSON.parse(e.data);if(m.type==='error'){status(m.message);return}if(m.type==='joined'){selfId=m.self_id;isHost=m.is_host;addTile(selfId,m.display_name,localStream,true);m.participants.forEach(p=>{if(p.id!==selfId)addTile(p.id,p.name,null,false)});document.getElementById('start').disabled=!isHost;document.getElementById('end').disabled=!isHost;if(m.started){startedAt=m.started_at;setTimer()}for(const p of m.existing_peers)await offerTo(p.id,p.name);status(isHost?'You are the GD host. Start when all students are ready.':'You joined the GD room. Wait for the host to start.')}else if(m.type==='peer_joined'){addTile(m.id,m.name,null,false)}else if(m.type==='offer')await handleOffer(m);else if(m.type==='answer')await handleAnswer(m);else if(m.type==='ice')await handleIce(m);else if(m.type==='peer_left'){removeTile(m.id);peers.get(m.id)?.pc.close();peers.delete(m.id)}else if(m.type==='host_changed'){isHost=m.host_id===selfId;document.getElementById('start').disabled=!isHost;document.getElementById('end').disabled=!isHost;status(isHost?'You are now the GD host.':'Host changed.')}else if(m.type==='gd_started'){startedAt=m.started_at;setTimer();document.getElementById('start').disabled=true;document.getElementById('end').disabled=!isHost;if(isHost)startRecording();status('GD started. 10-minute timer is running.')}else if(m.type==='gd_ended'){startedAt=null;clearInterval(timerHandle);timerEl.textContent='00:00';stopRecording();document.getElementById('start').disabled=true;document.getElementById('end').disabled=true;status('GD ended. Please return to the portal for feedback.')}};
document.getElementById('start').onclick=()=>ws.send(JSON.stringify({type:'start_gd'}));document.getElementById('end').onclick=()=>ws.send(JSON.stringify({type:'end_gd'}));document.getElementById('mute').onclick=()=>{let t=localStream?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('mute').textContent=t.enabled?'Mute':'Unmute'}};document.getElementById('camera').onclick=()=>{let t=localStream?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;document.getElementById('camera').textContent=t.enabled?'Camera Off':'Camera On'}};
window.addEventListener('beforeunload',()=>{try{ws.close()}catch(e){};localStream?.getTracks().forEach(t=>t.stop())});
</script></body></html>
